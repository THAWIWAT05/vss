
name: แตก ZIP ไปหน้าแรก Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP to root
        run: |
          python3 - <<'PY'
          import zipfile
          import shutil
          from pathlib import Path

          root = Path.cwd().resolve()
          archive = root / "GANG_CONTROL_DAILY.zip"

          if not archive.exists():
              raise FileNotFoundError("ไม่พบ ZIP")

          with zipfile.ZipFile(archive) as z:
              files = [
                  i for i in z.infolist()
                  if not i.is_dir()
              ]

              if not files:
                  raise Exception("ZIP ไม่มีไฟล์")

              # ตรวจสอบโฟลเดอร์หลักของ ZIP
              first_parts = [
                  Path(i.filename).parts[0]
                  for i in files
                  if Path(i.filename).parts
              ]

              common_folder = None

              if (
                  first_parts
                  and len(set(first_parts)) == 1
                  and all(
                      len(Path(i.filename).parts) > 1
                      for i in files
                  )
              ):
                  common_folder = first_parts[0]

              # ลบโฟลเดอร์เดิมที่แตกไว้ก่อนหน้า
              if common_folder:
                  old = (root / common_folder).resolve()

                  if old.parent == root and old.is_dir():
                      shutil.rmtree(old)

              # แตกไฟล์ทั้งหมดไปยัง Root
              for item in z.infolist():
                  parts = Path(item.filename).parts

                  if not parts:
                      continue

                  if common_folder:
                      parts = parts[1:]

                  if not parts:
                      continue

                  if any(
                      p == ".git"
                      or p == "node_modules"
                      or p == ".env"
                      or p.startswith(".env.")
                      for p in parts
                  ):
                      continue

                  target = (root / Path(*parts)).resolve()

                  if not target.is_relative_to(root):
                      continue

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(
                          parents=True, exist_ok=True
                      )

                      with z.open(item) as src:
                          target.write_bytes(src.read())

          print("แตกไฟล์ไปหน้าแรกสำเร็จ!")
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move project files to repository root" || echo "No changes"
          git push
